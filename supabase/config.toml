project_id = "fable"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_expiry = 600
otp_length = 6

[auth.email.template.magic_link]
subject = "Your Fable sign-in code"
content_path = "./supabase/templates/sign-in.html"

[storage]
enabled = true
file_size_limit = "100MiB"

[functions.sync]
verify_jwt = false
